name: build-test-coverage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore Shop.Orders.sln
      - name: Build
        run: dotnet build Shop.Orders.sln -c Release --no-restore
      - name: Test with coverage
        run: dotnet test Shop.Orders.sln -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory artifacts/after --logger "trx;LogFileName=tests.trx"
      - name: Require 100 percent lines and branches
        run: python scripts/coverage.py artifacts/after --enforce
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: artifacts/
